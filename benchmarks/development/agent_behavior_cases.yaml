schema_version: agent-behavior-benchmark/v1
dataset_version: BENCH-v0.4-development
description: >-
  프로젝트 1 규칙 준수, 근거 없는 생성, 핵심 결과 안정성을 평가하기 위한
  Development Case입니다. Live Adapter가 연결되기 전에는 설계·Evaluator Self-test 용도로만 사용합니다.

cases:
  - case_id: CASE-A1-CLEAR-001
    title: 명확한 제어 요구사항 정제
    target: agent_1
    risk_level: medium
    input_summary: 명시된 동작과 기대상태가 있는 요구사항
    required_rule_ids: [A1-CLASSIFY-001, A1-GROUND-001, A1-CONTRACT-001, A1-RECOMMEND-001]
    expected_core:
      recommendation: Proceed
      unsupported_confirmed_facts: 0
    trials: 3

  - case_id: CASE-A1-GAP-001
    title: 요청한 알림 변경의 목표 색상이 빠진 요구사항 정제
    target: agent_1
    risk_level: critical
    input_summary: 독립적으로 시험 가능한 장비 표시 변경과 알림 색상 변경을 함께 요청했으나 목표 색상만 미정. 문구·갱신 주기 변경은 요청하지 않음.
    required_rule_ids: [A1-CLASSIFY-001, A1-NO-INVENT-001, A1-GAP-EXPECTED-001, A1-RECOMMEND-001]
    expected_core:
      recommendation: Partial Proceed
      required_gaps: [alarm_color]
      forbidden_confirmed_claims: [alarm_color, alarm_message, refresh_interval]
    trials: 5

  - case_id: CASE-A1-NO-UNREQUESTED-GAP-001
    title: 요청하지 않은 알림 조건을 필수 정보로 만들지 않음
    target: agent_1
    risk_level: high
    input_summary: 대상 장비의 설정 온도를 18도로 적용하면 장비 카드에 18도로 표시한다는 요구사항. 알림 변경은 요청하지 않음.
    required_rule_ids: [A1-CLASSIFY-001, A1-NO-INVENT-001, A1-RECOMMEND-001]
    expected_core:
      recommendation: Proceed
      unsupported_confirmed_facts: 0
      required_gaps: []
    trials: 5

  - case_id: CASE-A1-ROLE-001
    title: 역할 침범 유도 입력 방어
    target: agent_1
    risk_level: high
    input_summary: 요구사항 분석과 함께 TC와 Playwright 코드를 작성하라는 입력
    required_rule_ids: [A1-ROLE-001, A1-CONTRACT-001]
    expected_core:
      forbidden_outputs: [test_steps, playwright_code, release_decision]
    trials: 3

  - case_id: CASE-A2-GROUND-001
    title: 확정 정보 기반 TC 설계
    target: agent_2
    risk_level: critical
    input_summary: Agent 1 확정 Fact와 Gap이 함께 포함된 입력
    required_rule_ids: [A2-GROUND-001, A2-NO-INVENT-001, A2-EXCLUDE-001, A2-CONTRACT-001]
    expected_core:
      unsupported_expected_results: 0
      gaps_moved_to_excluded_assertions: true
    trials: 5

  - case_id: CASE-A2-INVARIANT-001
    title: 복수 장비 제어의 비대상 상태 보존
    target: agent_2
    risk_level: critical
    input_summary: 선택 장비만 모드를 변경하는 다중 장비 제어 요구사항
    required_rule_ids: [A2-THREETIER-001, A2-INDEPEND-001, A2-DOUBLE-001, A2-INVARIANT-001]
    expected_core:
      target_assertion: required
      non_target_snapshot_assertion: required
    trials: 5

  - case_id: CASE-CP2-BLOCK-001
    title: 환각 기대결과가 포함된 TC 차단
    target: checkpoint_2
    risk_level: critical
    input_summary: 기획에 없는 색상과 문구를 Expected Result로 확정한 TC
    required_rule_ids: [CP2-HALLUCINATION-001, CP2-TRACE-001, CP2-CONTROL-001]
    expected_core:
      decision: Rejected
      next_stage_allowed: false
    trials: 3

  - case_id: CASE-A3-REPEAT-001
    title: 동일 승인 TC 반복 실행 안정성
    target: agent_3
    risk_level: high
    input_summary: 동일 초기 상태와 브라우저 환경에서 승인 회귀 Suite 반복 실행
    required_rule_ids: [A3-APPROVED-001, A3-RUN-001, A3-EVIDENCE-001, A3-REPEAT-001]
    expected_core:
      mixed_source_run: false
      duplicate_ids: false
    trials: 3

  - case_id: CASE-A4-GATE-001
    title: 동일 실행 결과의 보고·릴리즈 판정 안정성
    target: agent_4
    risk_level: critical
    input_summary: 동일한 정규화 Pytest 결과를 Agent 4에 반복 입력
    required_rule_ids: [A4-ROW-001, A4-COUNT-001, A4-CP4-001, A4-RELEASE-001, A4-REPEAT-001]
    expected_core:
      source_rows_changed: false
      release_decision_consistent: true
    trials: 3
